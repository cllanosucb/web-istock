<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iStock — Registrar Venta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <aside class="sidebar">
    <div class="brand sidebar-brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="7" y="2.5" width="10" height="19" rx="2.5" />
          <path d="M10.5 18.5h3" />
        </svg>
      </div>
      <span class="brand-name">iStock</span>
    </div>

    <nav class="sidebar-nav">
      <a href="dashboard.html" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 11.5 12 4l8 7.5" />
          <path d="M6 10v9a1 1 0 0 0 1 1h3v-6h4v6h3a1 1 0 0 0 1-1v-9" />
        </svg>
        Dashboard
      </a>
      <a href="inventario.html" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3.5 8 12 4l8.5 4-8.5 4-8.5-4Z" />
          <path d="M3.5 8v8L12 20l8.5-4V8" />
          <path d="M12 12v8" />
        </svg>
        Inventario
      </a>
      <a href="ventas.html" class="sidebar-link active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 8h12l-1 12H7L6 8Z" />
          <path d="M9 8V6a3 3 0 0 1 6 0v2" />
        </svg>
        Ventas
      </a>
    </nav>

    <div class="sidebar-footer">
      <button id="logout-btn" class="sidebar-logout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 4H6a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h3" />
          <path d="M15 16l4-4-4-4" />
          <path d="M19 12H9" />
        </svg>
        Cerrar sesión
      </button>
    </div>
  </aside>

  <main class="main-content">
    <h1 class="page-title" id="form-title">Registrar Nueva Venta</h1>

    <section class="card">
      <form id="venta-form">
        <div class="form-grid">
          <div class="form-group form-group-full">
            <label class="form-label" for="iphone">Seleccionar iPhone</label>
            <select class="form-input" id="iphone" name="iphone" required>
              <option value="">Seleccionar iPhone</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="fecha">Fecha de Venta</label>
            <input class="form-input" type="date" id="fecha" name="fecha" required />
          </div>

          <div class="form-group">
            <label class="form-label" for="cliente">Nombre del Cliente</label>
            <input class="form-input" type="text" id="cliente" name="cliente" placeholder="Mariana Rojas" required />
          </div>

          <div class="form-group">
            <label class="form-label" for="precio">Precio Final de Venta ($)</label>
            <input class="form-input" type="number" id="precio" name="precio" min="0" step="0.01" placeholder="650" required />
          </div>

          <div class="form-group">
            <label class="form-label" for="metodo-pago">Método de Pago</label>
            <select class="form-input" id="metodo-pago" name="metodoPago" required>
              <option value="">Seleccionar método</option>
              <option>Efectivo</option>
              <option>QR</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="garantia">Garantía Otorgada</label>
            <select class="form-input" id="garantia" name="garantia" required>
              <option value="">Seleccionar garantía</option>
              <option>Sin garantía</option>
              <option>1 mes</option>
              <option>3 meses</option>
            </select>
          </div>
        </div>

        <div class="form-actions">
          <a href="ventas.html" class="btn-secondary">Cancelar</a>
          <button type="submit" class="btn-primary">Confirmar Venta</button>
        </div>
      </form>
    </section>
  </main>

  <script src="js/ventas-form.js"></script>
</body>
</html>
