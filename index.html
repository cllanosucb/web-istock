<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iStock — Ingresar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="login-screen">
    <div class="card login-card">
      <div class="login-logo">iStock</div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">Usuario (correo)</label>
          <input class="form-input" type="email" id="email" name="email" value="admin@istock.com" placeholder="nombre@correo.com" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Contraseña</label>
          <input class="form-input" type="password" id="password" name="password" value="12345678" placeholder="••••••••" required />
        </div>

        <button type="submit" class="btn-primary" style="width: 100%; margin-top: 8px;">Ingresar</button>
      </form>
    </div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
