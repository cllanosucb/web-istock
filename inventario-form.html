<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iStock — Registrar Equipo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <aside class="sidebar">
    <div class="brand sidebar-brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="7" y="2.5" width="10" height="19" rx="2.5" />
          <path d="M10.5 18.5h3" />
        </svg>
      </div>
      <span class="brand-name">iStock</span>
    </div>

    <nav class="sidebar-nav">
      <a href="dashboard.html" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 11.5 12 4l8 7.5" />
          <path d="M6 10v9a1 1 0 0 0 1 1h3v-6h4v6h3a1 1 0 0 0 1-1v-9" />
        </svg>
        Dashboard
      </a>
      <a href="inventario.html" class="sidebar-link active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3.5 8 12 4l8.5 4-8.5 4-8.5-4Z" />
          <path d="M3.5 8v8L12 20l8.5-4V8" />
          <path d="M12 12v8" />
        </svg>
        Inventario
      </a>
      <a href="ventas.html" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 8h12l-1 12H7L6 8Z" />
          <path d="M9 8V6a3 3 0 0 1 6 0v2" />
        </svg>
        Ventas
      </a>
    </nav>

    <div class="sidebar-footer">
      <button id="logout-btn" class="sidebar-logout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 4H6a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h3" />
          <path d="M15 16l4-4-4-4" />
          <path d="M19 12H9" />
        </svg>
        Cerrar sesión
      </button>
    </div>
  </aside>

  <main class="main-content">
    <h1 class="page-title" id="form-title">Registrar Nuevo Equipo</h1>

    <section class="card">
      <form id="equipo-form">
        <div class="form-grid">
          <div class="form-group">
            <label class="form-label" for="imei">IMEI / Código Interno</label>
            <input class="form-input" type="text" id="imei" name="imei" placeholder="356789012345678" required />
          </div>

          <div class="form-group">
            <label class="form-label" for="modelo">Modelo</label>
            <select class="form-input" id="modelo" name="modelo" required>
              <option value="">Seleccionar modelo</option>
              <optgroup label="iPhone 11">
                <option>iPhone 11</option>
                <option>iPhone 11 Pro</option>
                <option>iPhone 11 Pro Max</option>
              </optgroup>
              <optgroup label="iPhone 12">
                <option>iPhone 12 Mini</option>
                <option>iPhone 12</option>
                <option>iPhone 12 Pro</option>
                <option>iPhone 12 Pro Max</option>
              </optgroup>
              <optgroup label="iPhone 13">
                <option>iPhone 13 Mini</option>
                <option>iPhone 13</option>
                <option>iPhone 13 Pro</option>
                <option>iPhone 13 Pro Max</option>
              </optgroup>
              <optgroup label="iPhone 14">
                <option>iPhone 14</option>
                <option>iPhone 14 Plus</option>
                <option>iPhone 14 Pro</option>
                <option>iPhone 14 Pro Max</option>
              </optgroup>
              <optgroup label="iPhone 15">
                <option>iPhone 15</option>
                <option>iPhone 15 Plus</option>
                <option>iPhone 15 Pro</option>
                <option>iPhone 15 Pro Max</option>
              </optgroup>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="capacidad">Capacidad</label>
            <select class="form-input" id="capacidad" name="capacidad" required>
              <option value="">Seleccionar capacidad</option>
              <option>64GB</option>
              <option>128GB</option>
              <option>256GB</option>
              <option>512GB</option>
              <option>1TB</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="color">Color</label>
            <input class="form-input" type="text" id="color" name="color" placeholder="Grafito" required />
          </div>

          <div class="form-group">
            <label class="form-label" for="bateria">Salud de Batería (%)</label>
            <input class="form-input" type="number" id="bateria" name="bateria" min="1" max="100" placeholder="92" required />
          </div>

          <div class="form-group">
            <label class="form-label" for="estado">Estado</label>
            <select class="form-input" id="estado" name="estado" required>
              <option value="">Seleccionar estado</option>
              <option>Disponible</option>
              <option>En Reparación</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="precio-compra">Precio de Compra ($)</label>
            <input class="form-input" type="number" id="precio-compra" name="precioCompra" min="0" step="0.01" placeholder="380" required />
          </div>

          <div class="form-group">
            <label class="form-label" for="precio-venta">Precio de Venta Sugerido ($)</label>
            <input class="form-input" type="number" id="precio-venta" name="precioVenta" min="0" step="0.01" placeholder="480" required />
          </div>
        </div>

        <div class="form-actions">
          <a href="inventario.html" class="btn-secondary">Cancelar</a>
          <button type="submit" class="btn-primary">Guardar Equipo</button>
        </div>
      </form>
    </section>
  </main>

  <script src="js/inventario-form.js"></script>
</body>
</html>
